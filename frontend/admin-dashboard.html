<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Sumaa FIN Services - Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <div class="sidebar">
      <div class="brand">
        <div class="logo"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="8" width="16" height="12" rx="3" stroke="#fff" stroke-width="1.5"/><circle cx="9" cy="13" r="1.5" fill="#fff"/><circle cx="15" cy="13" r="1.5" fill="#fff"/><path d="M9 17h6" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/><path d="M12 4v4" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/><circle cx="12" cy="3" r="1.2" fill="#fff"/><path d="M7 8V6.5" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/><path d="M17 8V6.5" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/></svg></div>
        <h1 style="font-size:16px;">Sumaa FIN Services Admin</h1>
      </div>
      <nav>
        <a href="admin-dashboard.html" class="active">Dashboard</a>
        <a href="admin-users.html">Users</a>
        <a href="admin-deposits.html">Deposits</a>
        <a href="admin-withdrawals.html">Withdrawals</a>
        <a href="admin-bulk-adjustment.html">Bulk % Adjustment</a>
        <a href="admin-support.html">Support</a>
        <a href="admin-settings.html">Settings</a>
      </nav>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h2>Admin Dashboard</h2>
        </div>
        <div class="topbar-right">
                  <div class="user-chip"><span id="adminName">-</span><span class="badge admin">admin</span></div>
          <a href="admin-notifications.html" class="icon-btn" id="notifBellBtn" aria-label="Notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="nav-badge" id="notifBadge"></span>
          </a>
          <a href="#" class="icon-btn logout-btn" id="logoutLink" aria-label="Logout">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </a>
        </div>
      </div>

      <div class="grid">
        <div class="stat-card">
          <div class="label">Total Users</div>
          <div class="value" id="totalUsers">0</div>
        </div>
        <div class="stat-card">
          <div class="label">Total Deposited</div>
          <div class="value green" id="totalDeposited">$0.00</div>
        </div>
        <div class="stat-card">
          <div class="label">Total Withdrawn</div>
          <div class="value red" id="totalWithdrawn">$0.00</div>
        </div>
        <div class="stat-card">
          <div class="label">Pending Deposits</div>
          <div class="value gold" id="pendingDeposits">0</div>
        </div>
        <div class="stat-card">
          <div class="label">Pending Withdrawals</div>
          <div class="value gold" id="pendingWithdrawals">0</div>
        </div>
      </div>

      <div class="panel">
        <h3>Quick Links</h3>
        <div class="action-row">
          <a href="admin-deposits.html"><button class="btn small">Review Pending Deposits</button></a>
          <a href="admin-withdrawals.html"><button class="btn small secondary">Review Pending Withdrawals</button></a>
          <a href="admin-users.html"><button class="btn small secondary">Manage Users</button></a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const admin = requireAdmin();
    if (admin) document.getElementById('adminName').textContent = admin.name;

    async function loadSummary() {
      try {
        const s = await apiFetch('/admin/summary');
        document.getElementById('totalUsers').textContent = s.totalUsers;
        document.getElementById('totalDeposited').textContent = formatMoney(s.totalDeposited);
        document.getElementById('totalWithdrawn').textContent = formatMoney(s.totalWithdrawn);
        document.getElementById('pendingDeposits').textContent = s.pendingDeposits;
        document.getElementById('pendingWithdrawals').textContent = s.pendingWithdrawals;
      } catch (err) {
        console.error(err);
      }
    }
    loadSummary();
  </script>
</body>
</html>
