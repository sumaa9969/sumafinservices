<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Sumaa FIN Services - Notifications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <div class="sidebar">
      <div class="brand">
        <div class="logo"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="8" width="16" height="12" rx="3" stroke="#fff" stroke-width="1.5"/><circle cx="9" cy="13" r="1.5" fill="#fff"/><circle cx="15" cy="13" r="1.5" fill="#fff"/><path d="M9 17h6" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/><path d="M12 4v4" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/><circle cx="12" cy="3" r="1.2" fill="#fff"/><path d="M7 8V6.5" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/><path d="M17 8V6.5" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/></svg></div>
        <h1 style="font-size:16px;">Sumaa FIN Services Admin</h1>
      </div>
      <nav>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-users.html">Users</a>
        <a href="admin-deposits.html">Deposits</a>
        <a href="admin-withdrawals.html">Withdrawals</a>
        <a href="admin-bulk-adjustment.html">Bulk % Adjustment</a>
        <a href="admin-support.html">Support</a>
        <a href="admin-settings.html">Settings</a>
      </nav>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h2>Notifications</h2>
        </div>
        <div class="topbar-right">
          <a href="admin-notifications.html" class="icon-btn" id="notifBellBtn" aria-label="Notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="nav-badge" id="notifBadge"></span>
          </a>
          <a href="#" class="icon-btn logout-btn" id="logoutLink" aria-label="Logout">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </a>
        </div>
      </div>

      <div class="panel" style="max-width:640px;">
        <h3>Send a notification</h3>
        <p class="empty-msg" style="padding-top:0;">Leave the recipient set to "All users" to broadcast, or pick one user to target them only.</p>
        <form id="sendForm">
          <label for="targetUser">Recipient</label>
          <select id="targetUser">
            <option value="">All users (broadcast)</option>
          </select>
          <label for="title">Title</label>
          <input type="text" id="title" maxlength="150" required placeholder="e.g. Scheduled maintenance">
          <label for="message">Message</label>
          <textarea id="message" rows="4" maxlength="1000" required placeholder="Write the notification text..."></textarea>
          <button type="submit" class="btn" id="sendBtn">Send</button>
        </form>
        <div class="error-box" id="errorBox"></div>
        <div class="success-box" id="successBox"></div>
      </div>

      <div class="panel">
        <h3>Sent Notifications</h3>
        <div id="tableWrap"><p class="empty-msg">Loading...</p></div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const admin = requireAdmin();

    async function loadUserOptions() {
      try {
        const data = await apiFetch('/admin/users');
        const select = document.getElementById('targetUser');
        data.users.filter(u => u.role !== 'admin').forEach(u => {
          const opt = document.createElement('option');
          opt.value = u.id;
          opt.textContent = `${u.name} (${u.user_code})`;
          select.appendChild(opt);
        });
      } catch (err) {
        console.error(err);
      }
    }

    async function loadNotifications() {
      const wrap = document.getElementById('tableWrap');
      try {
        const data = await apiFetch('/admin/notifications');
        if (!data.notifications.length) {
          wrap.innerHTML = '<p class="empty-msg">No notifications sent yet.</p>';
          return;
        }
        let html = '<table><thead><tr><th>Date</th><th>Recipient</th><th>Title</th><th>Message</th></tr></thead><tbody>';
        data.notifications.forEach(n => {
          html += `<tr>
            <td>${formatDate(n.created_at)}</td>
            <td>${n.user_id ? `${n.user_name} (${n.user_code})` : 'All users'}</td>
            <td>${n.title}</td>
            <td>${n.message}</td>
          </tr>`;
        });
        html += '</tbody></table>';
        wrap.innerHTML = html;
      } catch (err) {
        console.error(err);
      }
    }

    document.getElementById('sendForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('errorBox');
      const successBox = document.getElementById('successBox');
      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      const user_id = document.getElementById('targetUser').value || null;
      const title = document.getElementById('title').value.trim();
      const message = document.getElementById('message').value.trim();

      const btn = document.getElementById('sendBtn');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        await apiFetch('/admin/notifications', {
          method: 'POST',
          body: JSON.stringify({ title, message, user_id })
        });
        showBox(successBox, 'Notification sent.', false);
        document.getElementById('sendForm').reset();
        loadNotifications();
      } catch (err) {
        showBox(errorBox, err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send';
      }
    });

    loadUserOptions();
    loadNotifications();
  </script>
</body>
</html>
