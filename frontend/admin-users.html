<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Sumaa FIN Services - Manage Users</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <div class="sidebar">
      <div class="brand">
        <div class="logo"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="8" width="16" height="12" rx="3" stroke="#fff" stroke-width="1.5"/><circle cx="9" cy="13" r="1.5" fill="#fff"/><circle cx="15" cy="13" r="1.5" fill="#fff"/><path d="M9 17h6" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/><path d="M12 4v4" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/><circle cx="12" cy="3" r="1.2" fill="#fff"/><path d="M7 8V6.5" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/><path d="M17 8V6.5" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/></svg></div>
        <h1 style="font-size:16px;">Sumaa FIN Services Admin</h1>
      </div>
      <nav>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-users.html" class="active">Users</a>
        <a href="admin-deposits.html">Deposits</a>
        <a href="admin-withdrawals.html">Withdrawals</a>
        <a href="admin-bulk-adjustment.html">Bulk % Adjustment</a>
        <a href="admin-support.html">Support</a>
        <a href="admin-settings.html">Settings</a>
      </nav>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h2>Manage Users</h2>
        </div>
        <div class="topbar-right">
          <a href="admin-notifications.html" class="icon-btn" id="notifBellBtn" aria-label="Notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="nav-badge" id="notifBadge"></span>
          </a>
          <a href="#" class="icon-btn logout-btn" id="logoutLink" aria-label="Logout">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </a>
        </div>
      </div>

      <div class="panel">
        <h3>All Users</h3>
        <p class="empty-msg" style="padding-top:0;">
          Income Wallet credits are now applied in bulk from
          <a href="admin-bulk-adjustment.html">Bulk % Adjustment</a> — there's no per-user balance edit here anymore.
        </p>
        <div id="tableWrap"><p class="empty-msg">Loading...</p></div>
      </div>
    </div>
  </div>

  <!-- Reset password modal-ish inline panel -->
  <div id="resetPanel" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:50;">
    <div class="card" style="max-width:380px;">
      <h3 style="margin-top:0;">Reset Password</h3>
      <p class="empty-msg" id="resetUserLabel" style="padding-top:0;"></p>
      <label for="resetPassword">New Password</label>
      <input type="text" id="resetPassword" placeholder="At least 6 characters">
      <div class="action-row" style="margin-top:16px;">
        <button class="btn small" id="resetConfirmBtn">Confirm</button>
        <button class="btn small secondary" id="resetCancelBtn">Cancel</button>
      </div>
      <div class="error-box" id="resetError"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const admin = requireAdmin();

    let usersCache = [];

    function statusBadge(status) { return `<span class="badge ${status}">${status}</span>`; }
    function roleBadge(role) { return `<span class="badge ${role}">${role}</span>`; }

    async function loadUsers() {
      const wrap = document.getElementById('tableWrap');
      const data = await apiFetch('/admin/users');
      usersCache = data.users;
      if (!data.users.length) {
        wrap.innerHTML = '<p class="empty-msg">No users yet.</p>';
        return;
      }
      let html = '<table><thead><tr><th>Code</th><th>Name</th><th>Email</th><th>Role</th><th>Principal</th><th>Income</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead><tbody>';
      data.users.forEach(u => {
        html += `<tr>
          <td>${u.user_code}</td>
          <td>${u.name}</td>
          <td>${u.email}</td>
          <td>${roleBadge(u.role)}</td>
          <td>${formatMoney(u.principal_wallet)}</td>
          <td>${formatMoney(u.income_wallet)}</td>
          <td>${statusBadge(u.status)}</td>
          <td>${formatDate(u.created_at)}</td>
          <td>
            <div class="action-row">
              ${u.role === 'admin' ? '' : `
                <button class="btn small secondary" onclick="openReset(${u.id})">Reset Password</button>
                ${u.status === 'active'
                  ? `<button class="btn small danger" onclick="toggleStatus(${u.id}, 'blocked')">Block</button>`
                  : `<button class="btn small" onclick="toggleStatus(${u.id}, 'active')">Unblock</button>`}
              `}
            </div>
          </td>
        </tr>`;
      });
      html += '</tbody></table>';
      wrap.innerHTML = html;
    }

    async function toggleStatus(id, status) {
      if (!confirm(`Are you sure you want to set this user to "${status}"?`)) return;
      try {
        await apiFetch(`/admin/users/${id}/status`, {
          method: 'PATCH',
          body: JSON.stringify({ status })
        });
        loadUsers();
      } catch (err) {
        alert(err.message);
      }
    }

    let resetUserId = null;
    function openReset(id) {
      const u = usersCache.find(x => x.id === id);
      resetUserId = id;
      document.getElementById('resetUserLabel').textContent = `${u.name} (${u.user_code}) — ${u.email}`;
      document.getElementById('resetPassword').value = '';
      document.getElementById('resetError').style.display = 'none';
      document.getElementById('resetPanel').style.display = 'flex';
    }

    document.getElementById('resetCancelBtn').addEventListener('click', () => {
      document.getElementById('resetPanel').style.display = 'none';
    });

    document.getElementById('resetConfirmBtn').addEventListener('click', async () => {
      const errorBox = document.getElementById('resetError');
      errorBox.style.display = 'none';
      const newPassword = document.getElementById('resetPassword').value;
      if (!newPassword || newPassword.length < 6) {
        showBox(errorBox, 'Enter a password of at least 6 characters');
        return;
      }
      try {
        const result = await apiFetch(`/admin/users/${resetUserId}/reset-password`, {
          method: 'POST',
          body: JSON.stringify({ newPassword })
        });
        document.getElementById('resetPanel').style.display = 'none';
        alert(result.message);
      } catch (err) {
        showBox(errorBox, err.message);
      }
    });

    loadUsers();
  </script>
</body>
</html>
