<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Sumaa FIN Services - Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <div class="sidebar">
      <div class="brand">
        <div class="logo"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="8" width="16" height="12" rx="3" stroke="#fff" stroke-width="1.5"/><circle cx="9" cy="13" r="1.5" fill="#fff"/><circle cx="15" cy="13" r="1.5" fill="#fff"/><path d="M9 17h6" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/><path d="M12 4v4" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/><circle cx="12" cy="3" r="1.2" fill="#fff"/><path d="M7 8V6.5" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/><path d="M17 8V6.5" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/></svg></div>
        <h1 style="font-size:16px;">Sumaa FIN Services</h1>
      </div>
            <nav>
        <a href="dashboard.html" class="active">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="deposit.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
          Deposit
        </a>
        <a href="withdraw.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          Withdraw
        </a>
        <a href="support.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Support
        </a>
        <a href="profile.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Profile
        </a>
      </nav>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h2>Dashboard</h2>
        </div>
        <div class="topbar-right">
          <a href="notifications.html" class="icon-btn" id="notifBellBtn" aria-label="Notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="nav-badge" id="notifBadge"></span>
          </a>
          <div class="user-chip">
            <span id="userName">-</span>
            <span class="badge user" id="userCode">-</span>
          </div>
          <a href="#" class="icon-btn logout-btn" id="logoutLink" aria-label="Logout">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </a>
        </div>
      </div>

      <div class="grid">
        <div class="stat-card">
          <div class="label">Principal Wallet</div>
          <div class="value green" id="principalWallet">$0.00</div>
        </div>
        <div class="stat-card">
          <div class="label">Income Wallet</div>
          <div class="value green" id="incomeWallet">$0.00</div>
        </div>
        <div class="stat-card">
          <div class="label">Pending Deposits</div>
          <div class="value gold" id="pendingDeposits">$0.00</div>
        </div>
        <div class="stat-card">
          <div class="label">Pending Withdrawals</div>
          <div class="value gold" id="pendingWithdrawals">$0.00</div>
        </div>
      </div>

      <div class="panel">
        <h3>Recent Deposits</h3>
        <div id="depositsTableWrap"><p class="empty-msg">Loading...</p></div>
      </div>

      <div class="panel">
        <h3>Recent Withdrawals</h3>
        <div id="withdrawalsTableWrap"><p class="empty-msg">Loading...</p></div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const user = requireUser();
    initNotifBadge();

    function statusBadge(status) {
      return `<span class="badge ${status}">${status}</span>`;
    }

    function renderTable(wrapId, rows, columns) {
      const wrap = document.getElementById(wrapId);
      if (!rows.length) {
        wrap.innerHTML = '<p class="empty-msg">No records yet.</p>';
        return;
      }
      let html = '<table><thead><tr>';
      columns.forEach(c => html += `<th>${c.label}</th>`);
      html += '</tr></thead><tbody>';
      rows.forEach(r => {
        html += '<tr>';
        columns.forEach(c => html += `<td>${c.render(r)}</td>`);
        html += '</tr>';
      });
      html += '</tbody></table>';
      wrap.innerHTML = html;
    }

    async function loadDashboard() {
      try {
        const me = await apiFetch('/user/me');
        document.getElementById('userName').textContent = me.name;
        document.getElementById('userCode').textContent = me.userCode;
        document.getElementById('principalWallet').textContent = formatMoney(me.principal_wallet);
        document.getElementById('incomeWallet').textContent = formatMoney(me.income_wallet);
        document.getElementById('pendingDeposits').textContent = formatMoney(me.pending_deposits);
        document.getElementById('pendingWithdrawals').textContent = formatMoney(me.pending_withdrawals);

        const depData = await apiFetch('/user/deposits');
        renderTable('depositsTableWrap', depData.deposits.slice(0, 8), [
          { label: 'Date', render: r => formatDate(r.created_at) },
          { label: 'Amount', render: r => formatMoney(r.amount) },
          { label: 'Method', render: r => r.method || '-' },
          { label: 'Status', render: r => statusBadge(r.status) }
        ]);

        const wdData = await apiFetch('/user/withdrawals');
        renderTable('withdrawalsTableWrap', wdData.withdrawals.slice(0, 8), [
          { label: 'Date', render: r => formatDate(r.created_at) },
          { label: 'Wallet', render: r => r.wallet_type === 'income' ? 'Income' : 'Principal' },
          { label: 'Amount', render: r => formatMoney(r.amount) },
          { label: 'Method', render: r => r.method || '-' },
          { label: 'Status', render: r => statusBadge(r.status) }
        ]);
      } catch (err) {
        console.error(err);
      }
    }

    loadDashboard();
  </script>
</body>
</html>
