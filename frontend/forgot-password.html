<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Sumaa FIN Services - Forgot Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="center-page">
    <div class="card">
      <div class="brand">
        <div class="logo"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="8" width="16" height="12" rx="3" stroke="#fff" stroke-width="1.5"/><circle cx="9" cy="13" r="1.5" fill="#fff"/><circle cx="15" cy="13" r="1.5" fill="#fff"/><path d="M9 17h6" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/><path d="M12 4v4" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/><circle cx="12" cy="3" r="1.2" fill="#fff"/><path d="M7 8V6.5" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/><path d="M17 8V6.5" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/></svg></div>
        <h1>Sumaa FIN Services</h1>
      </div>

      <!-- STEP 1: Enter email -->
      <div id="step1">
        <div class="subtitle">Reset your password</div>
        <p style="font-size:13px; color:var(--muted); text-align:center; margin:0 0 20px;">
          Enter your registered email and we'll send you a 6-digit verification code.
        </p>
        <form id="step1Form">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="you@example.com" autocomplete="username">
          <button type="submit" class="btn" id="step1Btn">Send Verification Code</button>
        </form>
        <div class="error-box" id="step1Error"></div>
        <div class="success-box" id="step1Success"></div>
      </div>

      <!-- STEP 2: Enter OTP + new password -->
      <div id="step2" style="display:none;">
        <div class="subtitle">Enter your verification code</div>
        <p style="font-size:13px; color:var(--muted); text-align:center; margin:0 0 20px;">
          A 6-digit code was sent to <strong id="sentToEmail" style="color:var(--text);"></strong>.
          It expires in 5 minutes.
        </p>
        <form id="step2Form">
          <label for="otp">Verification Code</label>
          <input type="text" id="otp" required placeholder="000000" maxlength="6"
            style="letter-spacing:6px; font-size:22px; text-align:center; font-weight:700;"
            autocomplete="one-time-code" inputmode="numeric">

          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password">

          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" required minlength="6" placeholder="Repeat password" autocomplete="new-password">

          <button type="submit" class="btn" id="step2Btn">Reset Password</button>
        </form>
        <div class="error-box" id="step2Error"></div>
        <div class="success-box" id="step2Success"></div>

        <div style="text-align:center; margin-top:14px;">
          <a href="#" id="resendLink" style="font-size:13px; color:var(--muted);">Resend code</a>
        </div>
      </div>

      <!-- STEP 3: Success -->
      <div id="step3" style="display:none; text-align:center; padding:10px 0;">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2" style="margin-bottom:16px;"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>
        <h3 style="margin:0 0 10px; color:var(--green);">Password Reset!</h3>
        <p style="color:var(--muted); font-size:13px;">Your password has been reset successfully.</p>
        <a href="login.html"><button class="btn" style="margin-top:10px;">Back to Login</button></a>
      </div>

      <div class="foot-note" id="backLink">
        <a href="login.html">← Back to login</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    let submittedEmail = '';

    const step1Form = document.getElementById('step1Form');
    const step1Btn = document.getElementById('step1Btn');
    const step1Error = document.getElementById('step1Error');
    const step1Success = document.getElementById('step1Success');

    const step2Form = document.getElementById('step2Form');
    const step2Btn = document.getElementById('step2Btn');
    const step2Error = document.getElementById('step2Error');
    const step2Success = document.getElementById('step2Success');

    async function requestCode(email) {
      return apiFetch('/auth/forgot-password/request', {
        method: 'POST',
        body: JSON.stringify({ email })
      });
    }

    step1Form.addEventListener('submit', async (e) => {
      e.preventDefault();
      step1Error.style.display = 'none';
      step1Success.style.display = 'none';
      step1Btn.disabled = true;
      step1Btn.textContent = 'Sending...';

      try {
        const email = document.getElementById('email').value.trim();
        const data = await requestCode(email);

        submittedEmail = email;
        document.getElementById('sentToEmail').textContent = email;

        // In dev mode, backend returns the OTP for easy testing
        if (data.dev_otp) {
          showBox(step1Success, `[Dev mode] Your OTP is: ${data.dev_otp}`, false);
        }

        // Show step 2 after short delay so user can read message
        setTimeout(() => {
          document.getElementById('step1').style.display = 'none';
          document.getElementById('step2').style.display = 'block';
        }, data.dev_otp ? 1500 : 800);
      } catch (err) {
        showBox(step1Error, err.message || 'Failed to send code. Please try again.');
      } finally {
        step1Btn.disabled = false;
        step1Btn.textContent = 'Send Verification Code';
      }
    });

    document.getElementById('resendLink').addEventListener('click', async (e) => {
      e.preventDefault();
      step2Error.style.display = 'none';
      step2Success.style.display = 'none';
      try {
        const data = await requestCode(submittedEmail);
        showBox(step2Success, data.dev_otp ? `[Dev] New OTP: ${data.dev_otp}` : 'A new code has been sent to your email.', false);
      } catch (err) {
        showBox(step2Error, err.message || 'Failed to resend code.');
      }
    });

    step2Form.addEventListener('submit', async (e) => {
      e.preventDefault();
      step2Error.style.display = 'none';
      step2Success.style.display = 'none';

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        showBox(step2Error, 'Passwords do not match');
        return;
      }

      step2Btn.disabled = true;
      step2Btn.textContent = 'Resetting...';

      try {
        await apiFetch('/auth/forgot-password/reset', {
          method: 'POST',
          body: JSON.stringify({
            email: submittedEmail,
            otp: document.getElementById('otp').value.trim(),
            newPassword,
            confirmPassword
          })
        });

        document.getElementById('step2').style.display = 'none';
        document.getElementById('step3').style.display = 'block';
        document.getElementById('backLink').style.display = 'none';
      } catch (err) {
        showBox(step2Error, err.message || 'Reset failed. Please try again.');
      } finally {
        step2Btn.disabled = false;
        step2Btn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
